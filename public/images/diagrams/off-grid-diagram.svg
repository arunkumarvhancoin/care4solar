<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="1" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="solar-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154026" />
      <stop offset="100%" stop-color="#0D2818" />
    </linearGradient>

    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <pattern id="arch-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E8EAE6" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="480" fill="#FAF9F6" />
  <rect width="640" height="480" fill="url(#arch-grid)" />
  <rect x="0.5" y="0.5" width="639" height="479" fill="none" stroke="#E5E8E3" />

  <!-- Title Badge (Top-Left) -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" font-size="11" font-weight="700" letter-spacing="1.5" fill="#15532E" font-family="ui-monospace, monospace">OFF-GRID ARCHITECTURE</text>
    <text x="0" y="34" font-size="18" font-weight="700" fill="#202720">Independent Solar with Battery Storage</text>
  </g>

  <!-- Sun & Solar Radiance (Top Left) -->
  <g transform="translate(70, 95)">
    <circle cx="0" cy="0" r="42" fill="url(#sun-glow)" opacity="0.3" />
    <circle cx="0" cy="0" r="28" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="18" fill="#F59E0B" />
    <path d="M 12 16 L 85 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 24 10 L 130 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 30 -2 L 180 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
  </g>

  <!-- Natural Ground Horizon Line with Remote Landscape Feel -->
  <path d="M 32 380 Q 200 375 350 380 T 608 375" fill="none" stroke="#CBD2C9" stroke-width="2" />
  <line x1="32" y1="388" x2="608" y2="388" stroke="#E5E8E3" stroke-width="1" />

  <!-- Natural Trees & Greenery on both sides (Remote / Countryside ambiance) -->
  <g transform="translate(45, 380)">
    <!-- Pine tree 1 -->
    <polygon points="15,-65 28,-30 2,-30" fill="#EBF3EE" stroke="#15532E" stroke-width="1.2" opacity="0.7" />
    <polygon points="15,-45 32,-10 -2,-10" fill="#EBF3EE" stroke="#15532E" stroke-width="1.2" opacity="0.7" />
    <line x1="15" y1="-10" x2="15" y2="0" stroke="#15532E" stroke-width="1.5" />
  </g>
  <g transform="translate(540, 375)">
    <!-- Pine tree 2 -->
    <polygon points="20,-85 35,-45 5,-45" fill="#EBF3EE" stroke="#15532E" stroke-width="1.2" opacity="0.7" />
    <polygon points="20,-60 40,-20 0,-20" fill="#EBF3EE" stroke="#15532E" stroke-width="1.2" opacity="0.7" />
    <line x1="20" y1="-20" x2="20" y2="0" stroke="#15532E" stroke-width="1.5" />
  </g>

  <!-- =========================================================================
       MODERN STANDALONE RESIDENCE / CABIN
       ========================================================================= -->
  <g transform="translate(130, 160)" filter="url(#soft-shadow)">
    <!-- Main House Structure -->
    <polygon points="40,90 190,40 260,85 260,220 40,220" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1.8" />
    <polygon points="40,90 190,40 190,220 40,220" fill="#F7F8F6" stroke="#BAC2B7" stroke-width="1.8" />
    
    <!-- Architectural Windows -->
    <rect x="65" y="125" width="45" height="65" fill="#EBF3EE" stroke="#94A390" stroke-width="1.5" />
    <line x1="87" y1="125" x2="87" y2="190" stroke="#94A390" stroke-width="1" />
    <line x1="65" y1="157" x2="110" y2="157" stroke="#94A390" stroke-width="1" />

    <rect x="130" y="90" width="40" height="40" fill="#EBF3EE" stroke="#94A390" stroke-width="1.5" />
    <rect x="135" y="160" width="30" height="60" fill="#E5E8E3" stroke="#94A390" stroke-width="1.5" />

    <!-- ROOF SLAB WITH SOLAR ARRAY -->
    <polygon points="25,95 190,35 275,85 110,145" fill="#374151" stroke="#202720" stroke-width="2" />

    <!-- SOLAR MODULE 1 -->
    <g transform="translate(42, 68)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- SOLAR MODULE 2 -->
    <g transform="translate(100, 48)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- OFF-GRID INVERTER ON SIDE WALL -->
    <g transform="translate(202, 145)">
      <rect width="24" height="34" rx="2" fill="#FFFFFF" stroke="#15532E" stroke-width="1.5" />
      <circle cx="12" cy="154" r="2" fill="#22C55E" />
      <line x1="4" y1="16" x2="20" y2="16" stroke="#BAC2B7" stroke-width="1" />
      <line x1="4" y1="20" x2="20" y2="20" stroke="#BAC2B7" stroke-width="1" />
    </g>
  </g>

  <!-- =========================================================================
       DEDICATED BATTERY STORAGE ENCLOSURE (RIGHT SIDE)
       ========================================================================= -->
  <g transform="translate(425, 240)" filter="url(#soft-shadow)">
    <!-- Concrete Foundation Plinth -->
    <rect x="-8" y="130" width="100" height="10" fill="#E5E8E3" stroke="#BAC2B7" stroke-width="1" />
    <!-- Weatherproof Battery Cabinet -->
    <rect x="0" y="20" width="84" height="110" rx="3" fill="#FFFFFF" stroke="#15532E" stroke-width="2" />
    
    <!-- Cabinet Header & Ventilation -->
    <rect x="10" y="28" width="64" height="12" rx="1" fill="#EBF3EE" />
    <text x="42" y="37" font-size="7.5" font-weight="700" fill="#15532E" text-anchor="middle" font-family="ui-monospace, monospace">BATTERY BANK</text>

    <!-- Battery Module Trays (Stacked Lithium) -->
    <!-- Module 1 -->
    <rect x="10" y="46" width="64" height="16" rx="1.5" fill="#F7F8F6" stroke="#CBD2C9" stroke-width="1" />
    <circle cx="18" cy="54" r="2" fill="#22C55E" />
    <rect x="26" y="52" width="38" height="4" rx="1" fill="#22C55E" opacity="0.8" />

    <!-- Module 2 -->
    <rect x="10" y="66" width="64" height="16" rx="1.5" fill="#F7F8F6" stroke="#CBD2C9" stroke-width="1" />
    <circle cx="18" cy="74" r="2" fill="#22C55E" />
    <rect x="26" y="72" width="38" height="4" rx="1" fill="#22C55E" opacity="0.8" />

    <!-- Module 3 -->
    <rect x="10" y="86" width="64" height="16" rx="1.5" fill="#F7F8F6" stroke="#CBD2C9" stroke-width="1" />
    <circle cx="18" cy="94" r="2" fill="#22C55E" />
    <rect x="26" y="92" width="38" height="4" rx="1" fill="#22C55E" opacity="0.8" />

    <!-- Capacity Label -->
    <text x="42" y="118" font-size="8" font-weight="600" fill="#15532E" text-anchor="middle" font-family="ui-monospace, monospace">100% CHARGED</text>
  </g>

  <!-- Power Conduit Cable connecting House to Battery -->
  <path d="M 356 325 L 425 325" fill="none" stroke="#15532E" stroke-width="3" stroke-dasharray="4 2" />

  <!-- NO GRID ICON / BADGE (UPPER RIGHT) -->
  <g transform="translate(480, 85)">
    <rect width="130" height="44" rx="2" fill="#FFFFFF" stroke="#CBD2C9" stroke-width="1" />
    <circle cx="22" cy="22" r="10" fill="#FEE2E2" />
    <!-- Disconnected Power Plug -->
    <path d="M 16 16 L 28 28 M 28 16 L 16 28" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" />
    <text x="40" y="19" font-size="10" font-weight="700" fill="#202720">No Grid Required</text>
    <text x="40" y="32" font-size="9" fill="#6B7280">100% Self-Sufficient</text>
  </g>

  <!-- =========================================================================
       EDITORIAL CALLOUT LABELS
       ========================================================================= -->
  <!-- Callout 1: Rooftop Array -->
  <g transform="translate(140, 75)">
    <line x1="75" y1="35" x2="75" y2="10" stroke="#15532E" stroke-width="1" />
    <circle cx="75" cy="35" r="2.5" fill="#15532E" />
    <line x1="75" y1="10" x2="30" y2="10" stroke="#15532E" stroke-width="1" />
    <rect x="-60" y="-2" width="88" height="22" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1" />
    <text x="-16" y="13" font-size="10" font-weight="700" fill="#15532E" text-anchor="middle">Rooftop Solar</text>
  </g>

  <!-- Callout 2: Battery Storage Bank -->
  <g transform="translate(465, 205)">
    <line x1="0" y1="35" x2="0" y2="10" stroke="#15532E" stroke-width="1" />
    <circle cx="0" cy="35" r="2.5" fill="#15532E" />
    <rect x="-60" y="-14" width="120" height="24" fill="#FFFFFF" stroke="#15532E" stroke-width="1.2" />
    <text x="0" y="2" font-size="10" font-weight="700" fill="#15532E" text-anchor="middle">Battery Bank (24/7)</text>
  </g>

  <!-- Bottom Informative Engineering Banner -->
  <g transform="translate(32, 405)">
    <rect width="576" height="52" fill="#FFFFFF" stroke="#E5E8E3" stroke-width="1.2" />
    <circle cx="24" cy="26" r="4" fill="#15532E" />
    <text x="36" y="22" font-size="11" font-weight="700" fill="#15532E">How it operates:</text>
    <text x="36" y="38" font-size="11" fill="#4B5563">Daytime solar powers your property and fully charges the high-capacity battery bank to deliver uninterrupted power all night.</text>
  </g>
</svg>