<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="1" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="solar-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154026" />
      <stop offset="100%" stop-color="#0D2818" />
    </linearGradient>

    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <pattern id="arch-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E8EAE6" />
    </pattern>
  </defs>

  <rect width="640" height="480" fill="#FAF9F6" />
  <rect width="640" height="480" fill="url(#arch-grid)" />
  <rect x="0.5" y="0.5" width="639" height="479" fill="none" stroke="#E5E8E3" />

  <!-- Title Badge (Top-Left) -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" font-size="11" font-weight="700" letter-spacing="1.5" fill="#15532E" font-family="ui-monospace, monospace">STORAGE EXPANSION ARCHITECTURE</text>
    <text x="0" y="34" font-size="18" font-weight="700" fill="#202720">Solar + Modular Battery Storage</text>
  </g>

  <!-- Sun & Solar Radiance (Top Left) -->
  <g transform="translate(70, 95)">
    <circle cx="0" cy="0" r="42" fill="url(#sun-glow)" opacity="0.3" />
    <circle cx="0" cy="0" r="28" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="18" fill="#F59E0B" />
    <path d="M 12 16 L 85 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 24 10 L 130 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 30 -2 L 180 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
  </g>

  <!-- Ground Horizon Line -->
  <line x1="32" y1="380" x2="608" y2="380" stroke="#CBD2C9" stroke-width="2" />
  <line x1="32" y1="388" x2="608" y2="388" stroke="#E5E8E3" stroke-width="1" />

  <!-- Architectural Modern Residence (Left-Center) -->
  <g transform="translate(70, 160)" filter="url(#soft-shadow)">
    <!-- House Structure -->
    <polygon points="40,90 190,40 260,85 260,220 40,220" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1.8" />
    <polygon points="40,90 190,40 190,220 40,220" fill="#F7F8F6" stroke="#BAC2B7" stroke-width="1.8" />
    
    <!-- Warm Lit Windows (Indicating Evening Power from Battery) -->
    <rect x="65" y="125" width="45" height="65" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" opacity="0.9" />
    <line x1="87" y1="125" x2="87" y2="190" stroke="#F59E0B" stroke-width="1" opacity="0.6" />
    <line x1="65" y1="157" x2="110" y2="157" stroke="#F59E0B" stroke-width="1" opacity="0.6" />

    <rect x="130" y="90" width="40" height="40" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" opacity="0.9" />
    <rect x="135" y="160" width="30" height="60" fill="#E5E8E3" stroke="#94A390" stroke-width="1.5" />

    <!-- ROOF SLAB WITH SOLAR ARRAY -->
    <polygon points="25,95 190,35 275,85 110,145" fill="#374151" stroke="#202720" stroke-width="2" />

    <!-- SOLAR MODULES -->
    <g transform="translate(42, 68)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <g transform="translate(100, 48)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- Solar Inverter on wall -->
    <g transform="translate(202, 145)">
      <rect width="22" height="30" rx="2" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1.5" />
      <circle cx="11" cy="153" r="2" fill="#22C55E" />
    </g>
  </g>

  <!-- =========================================================================
       HERO CLOSE-UP: MODULAR BATTERY STORAGE WALL (RIGHT SIDE)
       ========================================================================= -->
  <g transform="translate(385, 175)" filter="url(#soft-shadow)">
    <!-- Architectural Plinth / Mounting Wall -->
    <rect x="-15" y="0" width="215" height="205" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1.5" />
    
    <!-- Wall Texture Accent -->
    <rect x="-15" y="0" width="215" height="18" fill="#F7F8F6" stroke="#BAC2B7" stroke-width="1" />
    <text x="-5" y="13" font-size="9" font-weight="700" fill="#15532E" font-family="ui-monospace, monospace">ENERGY STORAGE WALL</text>

    <!-- SMART GATEWAY CONTROLLER (Top-Left of storage wall) -->
    <g transform="translate(0, 32)">
      <rect width="48" height="65" rx="2" fill="#F7F8F6" stroke="#15532E" stroke-width="1.5" />
      <rect x="8" y="10" width="32" height="8" rx="1" fill="#15532E" />
      <circle cx="24" cy="30" r="3" fill="#22C55E" />
      <text x="24" y="48" font-size="7" font-weight="700" fill="#15532E" text-anchor="middle" font-family="ui-monospace, monospace">GATEWAY</text>
    </g>

    <!-- MODULAR BATTERY PACK 1 (Primary 5kWh Module) -->
    <g transform="translate(62, 32)">
      <rect width="120" height="38" rx="3" fill="#FFFFFF" stroke="#15532E" stroke-width="2" />
      <circle cx="16" cy="19" r="3.5" fill="#22C55E" />
      <text x="28" y="22" font-size="10" font-weight="700" fill="#202720">Module 01 · 5 kWh</text>
      <!-- Battery Charge Bars -->
      <rect x="135" y="15" width="36" height="8" rx="1.5" fill="#EBF3EE" />
      <rect x="137" y="17" width="32" height="4" rx="1" fill="#22C55E" />
    </g>

    <!-- MODULAR BATTERY PACK 2 (Expansion 5kWh Module) -->
    <g transform="translate(62, 78)">
      <rect width="120" height="38" rx="3" fill="#FFFFFF" stroke="#15532E" stroke-width="2" />
      <circle cx="16" cy="19" r="3.5" fill="#22C55E" />
      <text x="28" y="22" font-size="10" font-weight="700" fill="#202720">Module 02 · 5 kWh</text>
      <rect x="135" y="15" width="36" height="8" rx="1.5" fill="#EBF3EE" />
      <rect x="137" y="17" width="32" height="4" rx="1" fill="#22C55E" />
    </g>

    <!-- MODULAR BATTERY PACK 3 (Expansion 5kWh Module) -->
    <g transform="translate(62, 124)">
      <rect width="120" height="38" rx="3" fill="#FFFFFF" stroke="#15532E" stroke-width="2" />
      <circle cx="16" cy="19" r="3.5" fill="#22C55E" />
      <text x="28" y="22" font-size="10" font-weight="700" fill="#202720">Module 03 · 5 kWh</text>
      <rect x="135" y="15" width="36" height="8" rx="1.5" fill="#EBF3EE" />
      <rect x="137" y="17" width="32" height="4" rx="1" fill="#22C55E" />
    </g>

    <!-- Total Sized Capacity Tag -->
    <g transform="translate(0, 172)">
      <rect width="182" height="22" rx="2" fill="#EBF3EE" />
      <text x="91" y="15" font-size="10" font-weight="700" fill="#15532E" text-anchor="middle" font-family="ui-monospace, monospace">SCALABLE CAPACITY: 15 kWh INSTALLED</text>
    </g>
  </g>

  <!-- Flow Conduit from Solar Inverter to Battery Wall -->
  <path d="M 295 315 L 370 315" fill="none" stroke="#15532E" stroke-width="3" stroke-dasharray="4 2" />

  <!-- EDITORIAL CALLOUT (TOP RIGHT) -->
  <g transform="translate(485, 80)">
    <rect width="125" height="42" rx="2" fill="#FFFFFF" stroke="#CBD2C9" stroke-width="1" />
    <circle cx="20" cy="21" r="9" fill="#FEF3C7" />
    <!-- Moon / Star (Evening discharge) -->
    <path d="M 23 15 A 6 6 0 1 0 23 27 A 7 7 0 0 1 23 15 Z" fill="#F59E0B" />
    <text x="36" y="18" font-size="10" font-weight="700" fill="#202720">Night Self-Use</text>
    <text x="36" y="31" font-size="9" fill="#6B7280">Zero Grid Import</text>
  </g>

  <!-- Bottom Informative Engineering Banner -->
  <g transform="translate(32, 405)">
    <rect width="576" height="52" fill="#FFFFFF" stroke="#E5E8E3" stroke-width="1.2" />
    <circle cx="24" cy="26" r="4" fill="#15532E" />
    <text x="36" y="22" font-size="11" font-weight="700" fill="#15532E">How it operates:</text>
    <text x="36" y="38" font-size="11" fill="#4B5563">Surplus daytime solar charges the modular battery wall. In the evening, the battery automatically discharges to power lights, air conditioning, and household loads.</text>
  </g>
</svg>