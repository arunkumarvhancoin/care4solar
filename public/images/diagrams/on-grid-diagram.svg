<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft architectural drop shadow -->
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="1" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>

    <!-- Solar Cell Gradient -->
    <linearGradient id="solar-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154026" />
      <stop offset="100%" stop-color="#0D2818" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="arch-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E8EAE6" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="480" fill="#FAF9F6" />
  <rect width="640" height="480" fill="url(#arch-grid)" />
  <rect x="0.5" y="0.5" width="639" height="479" fill="none" stroke="#E5E8E3" />

  <!-- Title Badge (Top-Left) -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" font-size="11" font-weight="700" letter-spacing="1.5" fill="#15532E" font-family="ui-monospace, monospace">ON-GRID ARCHITECTURE</text>
    <text x="0" y="34" font-size="18" font-weight="700" fill="#202720">Rooftop Solar with Net Metering</text>
  </g>

  <!-- Sun & Solar Radiance (Top Left) -->
  <g transform="translate(70, 95)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="42" fill="url(#sun-glow)" opacity="0.3" />
    <circle cx="0" cy="0" r="28" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="18" fill="#F59E0B" />
    <!-- Sun Rays Beaming to Roof -->
    <path d="M 12 16 L 85 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 24 10 L 130 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
    <path d="M 30 -2 L 180 92" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.85" />
  </g>

  <!-- Ground Horizon Line -->
  <line x1="32" y1="380" x2="608" y2="380" stroke="#CBD2C9" stroke-width="2" />
  <line x1="32" y1="388" x2="608" y2="388" stroke="#E5E8E3" stroke-width="1" />

  <!-- Trees & Foliage (Architectural Outline) -->
  <g transform="translate(55, 380)">
    <path d="M 0 0 L 0 -45 Q 12 -55 24 -45 T 48 -45 L 48 0 Z" fill="#EBF3EE" stroke="#15532E" stroke-width="1.2" opacity="0.6" />
    <line x1="24" y1="0" x2="24" y2="-45" stroke="#15532E" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- =========================================================================
       MODERN ARCHITECTURAL HOUSE (CENTER-LEFT)
       ========================================================================= -->
  <g transform="translate(130, 160)" filter="url(#soft-shadow)">
    <!-- Main House Structure -->
    <polygon points="40,90 190,40 260,85 260,220 40,220" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1.8" />
    
    <!-- Left Wall Shadow Facade -->
    <polygon points="40,90 190,40 190,220 40,220" fill="#F7F8F6" stroke="#BAC2B7" stroke-width="1.8" />
    
    <!-- Architectural Window (Front) -->
    <rect x="65" y="125" width="45" height="65" fill="#EBF3EE" stroke="#94A390" stroke-width="1.5" />
    <line x1="87" y1="125" x2="87" y2="190" stroke="#94A390" stroke-width="1" />
    <line x1="65" y1="157" x2="110" y2="157" stroke="#94A390" stroke-width="1" />

    <!-- Architectural Window (Upper Balcony) -->
    <rect x="130" y="90" width="40" height="40" fill="#EBF3EE" stroke="#94A390" stroke-width="1.5" />

    <!-- Front Door -->
    <rect x="135" y="160" width="30" height="60" fill="#E5E8E3" stroke="#94A390" stroke-width="1.5" />
    <circle cx="142" cy="192" r="1.5" fill="#374151" />

    <!-- ROOF SLAB WITH SOLAR ARRAY -->
    <!-- Roof Pitch Base -->
    <polygon points="25,95 190,35 275,85 110,145" fill="#374151" stroke="#202720" stroke-width="2" />

    <!-- SOLAR PV MODULE 1 (Left Roof Grid) -->
    <g transform="translate(42, 68)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <!-- Grid Lines -->
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- SOLAR PV MODULE 2 (Right Roof Grid) -->
    <g transform="translate(100, 48)">
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#solar-panel-grad)" stroke="#15532E" stroke-width="1.5" />
      <polygon points="0,22 68,-2 108,18 40,42" fill="url(#glass-glare)" />
      <!-- Grid Lines -->
      <line x1="34" y1="10" x2="74" y2="30" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
      <line x1="20" y1="17" x2="90" y2="-7" stroke="#2D9F5A" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- EXTERIOR WALL-MOUNTED ON-GRID INVERTER -->
    <g transform="translate(202, 145)">
      <rect width="24" height="34" rx="2" fill="#FFFFFF" stroke="#15532E" stroke-width="1.5" />
      <!-- Status LED -->
      <circle cx="12" cy="154" r="2" fill="#22C55E" />
      <!-- Cooling Fins -->
      <line x1="4" y1="16" x2="20" y2="16" stroke="#BAC2B7" stroke-width="1" />
      <line x1="4" y1="20" x2="20" y2="20" stroke="#BAC2B7" stroke-width="1" />
      <line x1="4" y1="24" x2="20" y2="24" stroke="#BAC2B7" stroke-width="1" />
    </g>

    <!-- EXTERIOR BI-DIRECTIONAL NET METER -->
    <g transform="translate(235, 155)">
      <rect width="18" height="24" rx="1.5" fill="#FFFFFF" stroke="#374151" stroke-width="1.5" />
      <rect x="3" y="4" width="12" height="6" fill="#15532E" opacity="0.15" />
      <!-- Dial / Display -->
      <line x1="5" y1="7" x2="13" y2="7" stroke="#15532E" stroke-width="1" />
    </g>
  </g>

  <!-- =========================================================================
       UTILITY POWER GRID POLE (RIGHT SIDE)
       ========================================================================= -->
  <g transform="translate(530, 150)">
    <!-- Main Utility Pole -->
    <line x1="20" y1="30" x2="20" y2="230" stroke="#6B7280" stroke-width="4.5" stroke-linecap="round" />
    <!-- Cross Arms -->
    <line x1="-15" y1="50" x2="55" y2="50" stroke="#4B5563" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="75" x2="50" y2="75" stroke="#4B5563" stroke-width="2.5" stroke-linecap="round" />
    <!-- Insulators -->
    <rect x="-14" y="42" width="6" height="8" fill="#15532E" rx="1" />
    <rect x="17" y="42" width="6" height="8" fill="#15532E" rx="1" />
    <rect x="48" y="42" width="6" height="8" fill="#15532E" rx="1" />
    <!-- Distribution Transformer Cylinder -->
    <rect x="23" y="90" width="16" height="28" rx="2" fill="#E5E8E3" stroke="#6B7280" stroke-width="1.5" />

    <!-- OVERHEAD GRID LINES RUNNING FROM POLE TO HOUSE NET METER -->
    <path d="M -11 50 Q -80 120 -148 165" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 3" />
    <path d="M 17 50 Q -60 130 -148 168" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 3" />
  </g>

  <!-- =========================================================================
       ENERGY FLOW ARROWS & DATA LABELS
       ========================================================================= -->
  <!-- 1. Solar DC Flow from Panels to Inverter -->
  <path d="M 285 245 L 332 295" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="332" cy="295" r="3" fill="#D97706" />

  <!-- 2. Power Export to Grid (Surplus Daytime Energy) -->
  <g transform="translate(400, 205)">
    <rect width="90" height="22" rx="2" fill="#EBF3EE" stroke="#15532E" stroke-width="1" />
    <path d="M 10 11 L 22 11 M 18 7 L 22 11 L 18 15" stroke="#15532E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="15" font-size="9" font-weight="700" fill="#15532E" font-family="ui-monospace, monospace">EXPORTING</text>
  </g>

  <!-- =========================================================================
       EDITORIAL CALLOUT LABELS (CLEAN ARCHITECTURAL POINTERS)
       ========================================================================= -->
  <!-- Callout 1: Solar Modules -->
  <g transform="translate(140, 75)">
    <line x1="75" y1="35" x2="75" y2="10" stroke="#15532E" stroke-width="1" />
    <circle cx="75" cy="35" r="2.5" fill="#15532E" />
    <line x1="75" y1="10" x2="30" y2="10" stroke="#15532E" stroke-width="1" />
    <rect x="-60" y="-2" width="88" height="22" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1" />
    <text x="-16" y="13" font-size="10" font-weight="700" fill="#15532E" text-anchor="middle">Rooftop Solar</text>
  </g>

  <!-- Callout 2: Inverter -->
  <g transform="translate(350, 310)">
    <line x1="-15" y1="0" x2="20" y2="0" stroke="#15532E" stroke-width="1" />
    <circle cx="-15" cy="0" r="2.5" fill="#15532E" />
    <rect x="22" y="-12" width="108" height="24" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1" />
    <text x="76" y="4" font-size="10" font-weight="700" fill="#202720" text-anchor="middle">On-Grid Inverter</text>
  </g>

  <!-- Callout 3: Utility Grid -->
  <g transform="translate(545, 100)">
    <rect x="-80" y="0" width="105" height="24" fill="#FFFFFF" stroke="#BAC2B7" stroke-width="1" />
    <text x="-27" y="16" font-size="10" font-weight="700" fill="#4B5563" text-anchor="middle">Utility Power Grid</text>
  </g>

  <!-- Bottom Informative Engineering Banner -->
  <g transform="translate(32, 405)">
    <rect width="576" height="52" fill="#FFFFFF" stroke="#E5E8E3" stroke-width="1.2" />
    <circle cx="24" cy="26" r="4" fill="#15532E" />
    <text x="36" y="22" font-size="11" font-weight="700" fill="#15532E">How it operates:</text>
    <text x="36" y="38" font-size="11" fill="#4B5563">Daytime sun powers your building directly. Surplus solar exports to the utility grid for power bill credits via net metering.</text>
  </g>
</svg>